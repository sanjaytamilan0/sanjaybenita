name: sanjay_and_benita
description: "A luxury wedding invitation website for Sanjay & Benita"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  intl: ^0.19.0
  pdf: ^3.10.8
  printing: ^5.13.2
  audioplayers: ^6.0.0

dependency_overrides:
  image: 4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
